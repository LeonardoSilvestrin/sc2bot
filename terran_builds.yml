# Ares BuildOrderRunner configuration.
# Format reference: https://aressc2.github.io/ares-sc2/tutorials/build_runner.html
#
# This file owns only the deterministic opening. Dynamic Bio macro will take
# over after `build_order_runner.build_completed` becomes true.

# Never persist opponent/build history to disk. This is ladder-safe.
UseData: false
BuildSelection: Cycle
MinGamesWinrateBased: 3

BuildChoices:
    # test_123 is active if Debug: True (`config.yml`) -- use this to force a
    # specific opening for a local pilot game without touching the ladder-safe
    # cycles below (UseData: false means those always resolve to Cycle[0]).
    test_123:
        BotName: Test
        Cycle:
            - BansheeCloak
    Protoss:
        BotName: Protoss
        Cycle:
            - BioThreeOneOne
            - BansheeCloak
    Terran:
        BotName: Terran
        Cycle:
            - BioThreeOneOne
            - BansheeCloak
    Zerg:
        BotName: Zerg
        Cycle:
            - BioThreeOneOne
            - BansheeCloak
    Random:
        BotName: Random
        Cycle:
            - BioThreeOneOne
            - BansheeCloak

Builds:
    # Safe TvX pilot: Reaper expand into the standard Bio 3-1-1 convergence.
    # The goal is two bases, 3 Barracks, Factory, Starport, Stim, Combat
    # Shield, +1 Infantry Weapons and the first pair of Medivacs.
    BioThreeOneOne:
        AutoSupplyAtSupply: 30
        ConstantWorkerProductionTill: 55
        PersistentWorker: false
        ShouldHandleGasSteal: true
        OpeningBuildOrder:
            - 14 supply @ ramp
            - 16 barracks @ ramp
            - 16 gas
            - 0 orbital
            - 0 reaper
            - 19 expand
            - 20 supply @ ramp
            - 20 barracksreactor
            - 21 factory @ ramp
            - 21 gas
            - 22 marine *2
            - 23 barracks *2
            - 24 starport
            - 25 barrackstechlab *2
            - 26 stimpack
            - 26 shieldwall
            - 27 starportreactor
            - 28 engineeringbay
            - 28 terraninfantryweaponslevel1
            - 30 orbital
            - 32 marine *4
            - 36 medivac *2

    # Reaper expand into a 1 Factory / 2 Starport cloaked Banshee harass
    # opener. Same safe Reaper-expand opening as `BioThreeOneOne`, then
    # pivots at the Factory into two Starports with Tech Labs for Banshees,
    # Cloaking Field and Hyperflight Rotors instead of Bio tech.
    #
    # Barracks has nothing else to build while Factory/Starport/tech lab
    # soak up the gas for banshee tech, so the 22/26 marine fillers below
    # spend otherwise-idle minerals instead of letting Barracks sit empty
    # for the whole stretch before the first banshee pops.
    BansheeCloak:
        AutoSupplyAtSupply: 30
        ConstantWorkerProductionTill: 50
        PersistentWorker: false
        ShouldHandleGasSteal: true
        OpeningBuildOrder:
            - 14 supply @ ramp
            - 16 barracks @ ramp
            - 16 gas
            - 0 orbital
            - 0 reaper
            - 19 expand
            - 20 supply @ ramp
            - 20 factory @ ramp
            - 21 gas
            - 22 starport *2
            - 22 marine
            - 23 starporttechlab *2
            - 24 banshee *2
            - 26 marine *2
            - 27 bansheecloak
            - 27 bansheespeed
            - 28 orbital
            - 30 barracksreactor
            - 32 marine *2
            - 36 banshee
