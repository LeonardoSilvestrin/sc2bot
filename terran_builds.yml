# Ares BuildOrderRunner: the opening only. Economy behaviors take over once
# `build_order_runner.build_completed` is true.
# Format: https://aressc2.github.io/ares-sc2/tutorials/build_runner.html

# Never persist opponent/build history to disk: ladder-safe.
UseData: false
BuildSelection: Cycle
# The bot, not Ares, picks the opening: in `on_start` it draws an army style
# (bot/ego/planners/economy/styles.py) and switches to that style's build. The
# cycles below only list which builds exist for each race.

BuildChoices:
    # Active when `Debug: True` in config.yml.
    test_123:
        BotName: Test
        Cycle:
            - BioThreeOneOne
    Protoss:
        BotName: Protoss
        Cycle:
            - BioThreeOneOne
    Terran:
        BotName: Terran
        Cycle:
            - BioThreeOneOne
    Zerg:
        BotName: Zerg
        Cycle:
            - BioThreeOneOne
            - MechHellionTank
    Random:
        BotName: Random
        Cycle:
            - BioThreeOneOne

Builds:
    # Reaper expand into Bio 3-1-1: two bases, 3 Barracks, Factory, Starport,
    # Stim, Combat Shield, +1 Infantry Weapons and the first Medivacs.
    BioThreeOneOne:
        AutoSupplyAtSupply: 30
        ConstantWorkerProductionTill: 55
        PersistentWorker: false
        ShouldHandleGasSteal: true
        OpeningBuildOrder:
            - 14 supply @ ramp
            - 16 barracks @ ramp
            - 16 gas
            - 0 orbital
            - 0 reaper
            - 19 expand
            - 20 supply @ ramp
            - 20 barracksreactor
            - 21 factory @ ramp
            - 21 gas
            - 22 marine *2
            - 23 barracks *2
            - 24 starport
            - 25 barrackstechlab *2
            - 26 stimpack
            - 26 shieldwall
            - 27 starportreactor
            - 28 engineeringbay
            - 28 terraninfantryweaponslevel1
            - 30 orbital
            - 32 marine *4
            - 36 medivac *2

    # Reaper expand into mech: a reactor Factory for Hellions against the
    # first lings, then a Tech Lab Factory for Siege Tanks and Cyclones.
    MechHellionTank:
        AutoSupplyAtSupply: 30
        ConstantWorkerProductionTill: 55
        PersistentWorker: false
        ShouldHandleGasSteal: true
        OpeningBuildOrder:
            - 14 supply @ ramp
            - 16 barracks @ ramp
            - 16 gas
            - 0 orbital
            - 0 reaper
            - 19 expand
            - 20 supply @ ramp
            - 20 factory @ ramp
            - 21 gas
            - 22 marine *2
            - 23 factoryreactor
            - 24 factory
            - 25 gas
            - 26 hellion *2
            - 28 factorytechlab
            - 30 orbital
            - 30 hellion *2
            - 34 siegetank
            - 37 cyclone
