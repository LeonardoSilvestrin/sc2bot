# What a fight is made of, per canonical unit type: hit points, shields,
# armor, attributes, and the weapon of the mode the unit fights in (a Siege
# Tank sieged, a Lurker burrowed, a Viking in the air). Values of LotV 5.0.14
# at Faster speed, no upgrades, checked against that client's type data.
#
# The game's own data wins: `CombatModel.with_client` replaces armor,
# attributes and weapons with what the running client says, read from the
# `client` types listed (the unit itself when the key is left out). A unit with
# `client: []` keeps this table: a Baneling attacks once, a Widow Mine every
# 29 seconds, and a Carrier's damage is its Interceptors'. Hit points are never
# in the client's type data, so they always come from here.
#
# A weapon: `hits` ground, air or any; `damage` per attack, `attacks` per shot,
# `cooldown` in seconds, `bonus` by attribute, `splash` the targets one shot
# covers against a clump (as `bot.attention.units.SPLASH_TARGETS`).

units:
  # Terran
  MARINE:
    hp: 45
    armor: 0
    attributes: [Light, Biological]
    weapons:
      - {hits: any, damage: 6, cooldown: 0.61}
